<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Presente especial para Renata · Zenivita</title>
<meta property="og:title" content="Um presente especial para Renata 🌿">
<meta property="og:description" content="Protocolo Detox 7 Dias Zenivita — escolhida especialmente para você.">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --verde: #1D4D3A;
    --verde-medio: #2A6B52;
    --dourado: #C8A96E;
    --dourado-claro: #F5EDD8;
    --creme: #F9F6F0;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: #111;
    font-family: 'DM Sans', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
  }
  .cartao {
    width: 100%;
    max-width: 440px;
    background: var(--verde);
    border-radius: 24px;
    overflow: hidden;
    position: relative;
    box-shadow: 0 40px 80px rgba(0,0,0,0.6);
  }
  .deco {
    position: absolute;
    border-radius: 50%;
    border: 1px solid rgba(200,169,110,0.12);
    pointer-events: none;
  }
  .deco-1 { width: 320px; height: 320px; top: -100px; right: -100px; }
  .deco-2 { width: 220px; height: 220px; bottom: -70px; left: -50px; }
  .foto {
    width: 100%; height: 220px;
    object-fit: cover;
    opacity: 0.28;
    display: block;
  }
  .foto-overlay {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 220px;
    background: linear-gradient(to bottom, rgba(29,77,58,0.3), rgba(29,77,58,1));
  }
  .content {
    position: relative;
    z-index: 2;
    padding: 0 36px 36px;
    margin-top: -50px;
  }
  .marca {
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--dourado);
    display: block;
    margin-bottom: 20px;
  }
  .para {
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.35);
    margin-bottom: 4px;
  }
  .nome {
    font-family: 'Cormorant Garamond', serif;
    font-size: 56px;
    font-weight: 300;
    color: #fff;
    line-height: 1.05;
    margin-bottom: 20px;
  }
  .nome em {
    font-style: italic;
    color: var(--dourado);
  }
  .divider {
    width: 36px; height: 1px;
    background: var(--dourado);
    opacity: 0.5;
    margin-bottom: 20px;
  }
  .msg {
    font-family: 'Cormorant Garamond', serif;
    font-size: 17px;
    font-style: italic;
    line-height: 1.8;
    color: rgba(255,255,255,0.78);
    margin-bottom: 28px;
  }
  .btn {
    display: block;
    background: var(--dourado);
    color: var(--verde);
    text-decoration: none;
    text-align: center;
    padding: 15px 28px;
    border-radius: 100px;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 0.03em;
    transition: opacity 0.2s;
  }
  .btn:hover { opacity: 0.88; }
  .rodape {
    margin-top: 24px;
    padding-top: 18px;
    border-top: 1px solid rgba(255,255,255,0.07);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .rodape-marca {
    font-size: 11px;
    letter-spacing: 0.12em;
    color: rgba(255,255,255,0.2);
    text-transform: uppercase;
  }
  .folha { font-size: 16px; opacity: 0.25; }
</style>
</head>
<body>
<div class="cartao">
  <div class="deco deco-1"></div>
  <div class="deco deco-2"></div>
  <img class="foto" src="https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=600&q=80" alt="">
  <div class="foto-overlay"></div>
  <div class="content">
    <span class="marca">Zenivita · Saúde Preventiva Feminina</span>
    <p class="para">Para</p>
    <h1 class="nome"><em>Renata</em></h1>
    <div class="divider"></div>
    <p class="msg">"Rê, você foi uma das primeiras que lembrei quando finalizei esse protocolo. São 7 dias de saúde feminina de verdade — criados com muito cuidado. Espero que te faça muito bem."</p>
    <a class="btn" href="https://zenivita.com.br/detox-ebook.html">Acessar meu protocolo 🌿</a>
    <div class="rodape">
      <span class="rodape-marca">zenivita.com.br</span>
      <span class="folha">🌿</span>
    </div>
  </div>
</div>
</body>
</html>
